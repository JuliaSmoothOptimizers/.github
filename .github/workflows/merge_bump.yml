name: Merge Version Bump PR

on:
  workflow_run:
    workflows: ["CI"]

jobs:
  merge-version-bump:
    # Run Action if CI completed successfully and
    # an open PR is found with title starting with "Bump version to" on the
    # current branch.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Find version bump PR for this branch
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list \
            --repo ${{ github.repository }} \
            --head "$BRANCH" \
            --json number,title,body,baseRefName,commits \
            --jq '.[] | select(.title | startswith("Bump version to "))')

          if [ -z "$PR" ]; then
            echo "No version bump PR found for branch $BRANCH, skipping."
            exit 0
          fi

          PR_NUMBER=$(echo "$PR" | jq -r '.number')
          BASE_REF=$(echo "$PR" | jq -r '.baseRefName')
          TITLE=$(echo "$PR" | jq -r '.title')
          BODY=$(echo "$PR" | jq -r '.body // ""')
          VERSION=$(echo "$TITLE" | grep -oP 'Bump version to \K.*')
          LATEST_SHA=$(echo "$PR" | jq -r '.commits[-1].oid')
          RELEASE_NOTES=$(printf '%s\n' "$BODY" | awk '
            !in_notes && /^### Release notes$/ { in_notes=1; next }
            in_notes { print }
          ' | sed '/./,$!d')
          NOTES_DELIM="JSOBOT_RELEASE_NOTES_EOF"
          while printf '%s\n' "$RELEASE_NOTES" | grep -qx "$NOTES_DELIM"; do
            NOTES_DELIM="${NOTES_DELIM}_X"
          done

          echo "pr_number=$PR_NUMBER"   >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF"     >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"         >> $GITHUB_OUTPUT
          echo "version=$VERSION"       >> $GITHUB_OUTPUT
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          {
            echo "release_notes<<$NOTES_DELIM"
            echo "$RELEASE_NOTES"
            echo "$NOTES_DELIM"
          } >> $GITHUB_OUTPUT

      - name: Merge version bump PR and delete branch
        if: steps.find_pr.outputs.pr_number != ''
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.find_pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --rebase \
            --delete-branch

      - name: Get merge commit SHA
        # When a PR is merged, the commit sha changes (!!!).
        # Look for the commit sha on the tip of the base branch.
        if: steps.find_pr.outputs.pr_number != ''
        id: merge_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ steps.find_pr.outputs.base_ref }}
        run: |
          SHA=$(gh api \
            /repos/${{ github.repository }}/branches/$BASE_REF \
            --jq '.commit.sha')
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Comment on merge commit
        # Add a comment to the commit on the tip of the base branch
        # to trigger registration.
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.merge_commit.outputs.sha }}
          VERSION: ${{ steps.find_pr.outputs.version }}
          RELEASE_NOTES: ${{ steps.find_pr.outputs.release_notes }}
        run: |
          COMMENT="@JuliaRegistrator register"
          if [ -n "$RELEASE_NOTES" ]; then
            COMMENT=$(printf '%s\n\n### Release notes\n%s' "$COMMENT" "$RELEASE_NOTES")
          fi

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/commits/$SHA/comments" \
            --field body="$COMMENT"
            # --field-body="@JuliaRegistrator register"
